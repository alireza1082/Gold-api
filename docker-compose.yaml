services:
  caddy:
    image: caddy:2.10-alpine
    container_name: goldapi-caddy
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  gold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-price
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ONE_API_TOKEN: ${ONE_API_TOKEN:-}
      BRS_API_TOKEN: ${BRS_API_TOKEN:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    container_name: goldapi-redis
    restart: unless-stopped
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        else
          exec redis-server --appendonly yes;
        fi
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  internal:
    driver: bridge
