services:
  caddy-init:
    image: alpine:3.22
    container_name: goldapi-caddy-init
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data /config
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: gold-api-caddy:local
    container_name: goldapi-caddy
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      caddy-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal

  gold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-price
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    expose:
      - "8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ONE_API_TOKEN: ${ONE_API_TOKEN:-}
      BRS_API_TOKEN: ${BRS_API_TOKEN:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      HOKM_STRING: ${HOKM_STRING:-}
      XO_STRING: ${XO_STRING:-}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    networks:
      - internal

  redis-init:
    image: alpine:3.22
    container_name: goldapi-redis-init
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    command:
      - sh
      - -c
      - chown -R 999:1000 /data
    volumes:
      - redis_data:/data

  redis:
    image: redis:7.4-alpine
    container_name: goldapi-redis
    user: "999:1000"
    restart: unless-stopped
    init: true
    depends_on:
      redis-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
        else
          exec redis-server --appendonly yes;
        fi
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  internal:
    driver: bridge
